<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa học Front-end</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>KHÓA HỌC FRONT-END</h1>

    <div class="container">

        <div class="card">
            <i class="fa-brands fa-html5 icon"></i>
            <h2>HTML5</h2>
            <p>Học cách xây dựng cấu trúc của một trang web bằng HTML5.</p>
            <button>Chi tiết</button>
        </div>

        <div class="card">
            <i class="fa-brands fa-css3-alt icon"></i>
            <h2>CSS3</h2>
            <p>Thiết kế giao diện đẹp mắt với CSS3 và Flexbox.</p>
            <button>Chi tiết</button>
        </div>

        <div class="card">
            <i class="fa-brands fa-js icon"></i>
            <h2>JavaScript</h2>
            <p>Tạo website động với JavaScript hiện đại.</p>
            <button>Chi tiết</button>
        </div>

    </div>

</body>
</html>
